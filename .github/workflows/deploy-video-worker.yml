name: Deploy Jarvis video Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/image-to-video/**"
      - ".github/workflows/deploy-video-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker
        working-directory: cloudflare/image-to-video
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest deploy --config wrangler.toml

      - name: Configure private Worker token
        working-directory: cloudflare/image-to-video
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JARVIS_TOKEN: ${{ secrets.JARVIS_TOKEN }}
        run: |
          if [ -z "$JARVIS_TOKEN" ]; then
            echo "::error::GitHub secret JARVIS_TOKEN is missing."
            exit 1
          fi
          printf '%s' "$JARVIS_TOKEN" | npx --yes wrangler@latest secret put JARVIS_TOKEN --config wrangler.toml
