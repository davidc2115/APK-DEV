plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.assistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "jarvispass123"
            keyAlias "jarvisdebugkey"
            keyPassword "jarvispass123"
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        debug   { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true }

    packaging {
        resources {
            pickFirsts += ['**/libc++_shared.so', '**/libllama.so', 'META-INF/NOTICE.md', 'META-INF/LICENSE.md']
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // ── Core Android ──────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // ── Réseau ────────────────────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.json:json:20240303'

    // ── IA embarquée : MediaPipe LLM Inference (.task) ────────────────────────
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'

    // ── IA embarquée : llama.cpp GGUF (Qwen, etc., aucune licence propriétaire) ──
    implementation 'com.llamatik:library:0.12.0'

    // ── IA embarquée : ONNX Runtime GenAI (.onnx) ────────────────────────────
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // ── Email IMAP / SMTP ─────────────────────────────────────────────────────
    // JavaMail portage Android — lecture IMAP + envoi SMTP
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // ── Localisation ──────────────────────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ── Médias / ExoPlayer (optionnel : meilleure gestion audio) ─────────────
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
}
