plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.assistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            // Évite les conflits de fichiers entre librairies JNI
            pickFirsts += ['**/libc++_shared.so', '**/libllama.so']
        }
    }
}

dependencies {
    // ── Core Android ──────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    // ── Réseau ────────────────────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.json:json:20240303'

    // ── IA embarquée : MediaPipe LLM Inference (format .task) ─────────────────
    // Compatible : Gemma 2B, Gemma 3 1B, Falcon RW 1B, etc.
    implementation 'com.google.mediapipe:tasks-genai:0.10.24'

    // ── IA embarquée : llama.cpp Android binding (format .gguf) ───────────────
    // Supporte : LLaMA, Mistral, Phi-3, Gemma 2, DeepSeek, Qwen, etc.
    // Formats de quantification : Q4_0, Q4_K_M, Q5_K_M, Q8_0, F16, etc.
    implementation 'com.github.shubham0204:llama.android:0.0.6'

    // ── IA embarquée : ONNX Runtime GenAI (format .onnx) ─────────────────────
    // Supporte : Phi-3 Mini, Phi-3.5, modèles exportés en ONNX, etc.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
